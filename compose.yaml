services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cryptonews
      POSTGRES_USER: cryptonews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptonews -d cryptonews"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cryptonews:${POSTGRES_PASSWORD}@db:5432/cryptonews
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  db_data:
